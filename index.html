<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="HAUNT//HOUND — a 1v1 possessed-tank duel in a haunted CRT cockpit, in your browser." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <!-- Self-hosted OFL fonts (assets/fonts, licences alongside). Preload the
       two faces the title + HUD draw with; the others swap in when used. -->
  <link rel="preload" href="assets/fonts/vt323-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/share-tech-mono-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/orbitron-500.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/orbitron-700.woff2" as="font" type="font/woff2" crossorigin />
  <title>HAUNT//HOUND</title>
  <style>
    /* ── Self-hosted fonts (SIL OFL 1.1) ───────────────────── */
    @font-face { font-family: 'VT323'; font-style: normal; font-weight: 400; font-display: swap;
      src: url('assets/fonts/vt323-400.woff2') format('woff2'); }
    @font-face { font-family: 'Share Tech Mono'; font-style: normal; font-weight: 400; font-display: swap;
      src: url('assets/fonts/share-tech-mono-400.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: swap;
      src: url('assets/fonts/ibm-plex-mono-400.woff2') format('woff2'); }
    @font-face { font-family: 'Rajdhani'; font-style: normal; font-weight: 600; font-display: swap;
      src: url('assets/fonts/rajdhani-600.woff2') format('woff2'); }
    /* Orbitron: HUD readouts only (top strip, meters, taunts). SIL OFL, see OFL-Orbitron.txt */
    @font-face { font-family: 'Orbitron'; font-style: normal; font-weight: 400; font-display: swap;
      src: url('assets/fonts/orbitron-400.woff2') format('woff2'); }
    @font-face { font-family: 'Orbitron'; font-style: normal; font-weight: 500; font-display: swap;
      src: url('assets/fonts/orbitron-500.woff2') format('woff2'); }
    @font-face { font-family: 'Orbitron'; font-style: normal; font-weight: 700; font-display: swap;
      src: url('assets/fonts/orbitron-700.woff2') format('woff2'); }
    /* ── Reset & base ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Design tokens — never hard-code values elsewhere */
      --color-void:        #0A0D0B;
      --color-panel:       #121A15;
      --color-phosphor:    #39FF88;
      --color-phosphor-dim:#1F9E57;
      --color-bone:        #E8E2D0;
      --color-ash:         #8F9A92;
      --color-ember:       #FF8A3D;
      --color-blood:       #FF4D5E;
      --color-ghost:       #9FD8FF;

      --font-display: 'VT323', monospace;
      --font-hud:     'Share Tech Mono', monospace;
      --font-body:    'IBM Plex Mono', monospace;

      --focus-outline: 2px solid var(--color-ember);
    }

    html, body {
      width: 100%;
      height: 100%;
      /* Prefer small/dynamic viewport so iOS Safari toolbar doesn't clip the title/arena */
      height: 100dvh;
      height: 100svh;
      background: var(--color-void);
      color: var(--color-bone);
      font-family: var(--font-body);
      font-size: 14px;
      overflow: hidden;
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    /* ── Canvas fills the viewport ─────────────────────────── */
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      /* Canvas internal resolution set by JS to match devicePixelRatio */
    }

    /* ── Accessibility: visible keyboard focus ─────────────── */
    :focus-visible {
      outline: var(--focus-outline);
      outline-offset: 2px;
    }

    /* ── Loading state ─────────────────────────────────────── */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-void);
      font-family: var(--font-display);
      font-size: 24px;
      color: var(--color-phosphor);
      letter-spacing: 0.1em;
      /* Hidden once JS runs */
    }
    #loading[hidden] { display: none; }
  </style>
</head>
<body>
  <!--
    Single canvas: layers (world / fog+static / HUD) are drawn in order by the renderer.
    tabindex="0" lets keyboard users focus the canvas for input events.
    role="application" + aria-label give screen readers context.
  -->
  <canvas
    id="game-canvas"
    tabindex="0"
    role="application"
    aria-label="HAUNT//HOUND game canvas"
  ></canvas>

  <!-- Shown until the JS module initialises the game -->
  <div id="loading" aria-live="polite" aria-label="Loading HAUNT//HOUND">
    HAUNT//HOUND &mdash; LOADING&hellip;
  </div>

  <!-- ES module entry; defer is implicit for type="module" -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
