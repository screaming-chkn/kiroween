<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>C9e vs refs</title>
<style>
  html,body{margin:0;background:#000;color:#47FF9A;font:12px/1.3 ui-monospace,monospace}
  #wrap{display:flex;flex-direction:column;gap:14px;padding:14px}
  .row{display:flex;gap:10px;align-items:center}
  .cell{display:flex;flex-direction:column;align-items:center;gap:4px}
  canvas,img{background:#050505;border:1px solid #1a3a28}
  img{object-fit:contain;width:400px;height:280px}
  canvas{width:400px;height:280px}
</style>
</head><body>
<div id="wrap"></div>
<script type="module">
import { drawTank, setTankStyle, setTankPalette, setEdgeStyle } from '../src/ui/tankWire.js?v=c9e2';
setTankStyle('wheeled');
setTankPalette('mono-green');
setEdgeStyle('dashed-tech');
const PW = 400, PH = 280;
const refs = [
  { file: '_refs/ref1-red-wedge.jpg', kind: 'enemy', ang: -0.55, label: 'ref1', out: 'vs-ref1' },
  { file: '_refs/ref2-red-heavy.jpg', kind: 'enemy', ang: -0.85, label: 'ref2', out: 'vs-ref2' },
  { file: '_refs/ref3-green-light.jpg', kind: 'player', ang: -0.55, label: 'ref3', out: 'vs-ref3' },
  { file: '_refs/ref4-green-mbt.jpg', kind: 'player', ang: -0.55, label: 'ref4', out: 'vs-ref4' },
  { file: '_refs2/side1-green-long-gun.jpg', kind: 'player', ang: 0.05, label: 'side1', out: 'vs-side1' },
  { file: '_refs2/side2-red-light.jpg', kind: 'enemy', ang: 0.05, label: 'side2', out: 'vs-side2' },
  { file: '_refs2/side3-red-heavy-6wheel.jpg', kind: 'enemy', ang: 0.0, label: 'side3', out: 'vs-side3' },
  { file: '_refs2/side4-green-mbt.jpg', kind: 'player', ang: 0.05, label: 'side4', out: 'vs-side4' },
];
const wrap = document.getElementById('wrap');
for (const r of refs) {
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.name = r.out;
  const left = document.createElement('div');
  left.className = 'cell';
  const img = document.createElement('img');
  img.src = r.file;
  img.width = PW; img.height = PH;
  const ll = document.createElement('div');
  ll.textContent = r.label + ' ' + r.file.split('/').pop();
  left.appendChild(img); left.appendChild(ll);
  const right = document.createElement('div');
  right.className = 'cell';
  const c = document.createElement('canvas');
  c.width = PW; c.height = PH;
  const rl = document.createElement('div');
  rl.textContent = 'c9e ' + r.kind + (r.label.startsWith('side') ? ' (rot~0° near-side)' : '');
  right.appendChild(c); right.appendChild(rl);
  row.appendChild(left); row.appendChild(right);
  wrap.appendChild(row);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, PW, PH);
  // Center tank in equal panel
  ctx.save();
  ctx.translate(PW / 2, PH / 2 + 8);
  ctx.scale(1.9, 1.9);
  ctx.translate(-PW / 2, -(PH / 2 + 8));
  drawTank(ctx, r.kind, PW / 2, PH / 2 + 12, r.ang, r.ang + (r.label.startsWith('side') ? 0.08 : 0.12), 0);
  ctx.restore();
}
document.title = 'C9e vs refs ready';
</script>
</body></html>
