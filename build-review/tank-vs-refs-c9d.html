<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>C9d vs refs</title>
<style>
  html,body{margin:0;background:#000;color:#47FF9A;font:12px/1.3 ui-monospace,monospace}
  #wrap{display:flex;flex-direction:column;gap:14px;padding:14px}
  .row{display:flex;gap:10px;align-items:center}
  .cell{display:flex;flex-direction:column;align-items:center;gap:4px}
  canvas,img{background:#050505;border:1px solid #1a3a28}
  img{object-fit:contain;width:400px;height:280px}
  canvas{width:400px;height:280px}
</style>
</head><body>
<div id="wrap"></div>
<script type="module">
import { drawTank, setTankStyle, setTankPalette, setEdgeStyle } from '../src/ui/tankWire.js?v=c9d4';
setTankStyle('wheeled');
setTankPalette('mono-green');
setEdgeStyle('dashed-tech');
const refs = [
  { file: '_refs/ref1-red-wedge.jpg', kind: 'enemy', ang: -0.55, label: 'ref1 iso' },
  { file: '_refs/ref2-red-heavy.jpg', kind: 'enemy', ang: -0.85, label: 'ref2 iso' },
  { file: '_refs/ref3-green-light.jpg', kind: 'player', ang: -0.55, label: 'ref3 iso' },
  { file: '_refs/ref4-green-mbt.jpg', kind: 'player', ang: -0.55, label: 'ref4 iso' },
  { file: '_refs2/side1-green-long-gun.jpg', kind: 'player', ang: 0.05, label: 'side1' },
  { file: '_refs2/side2-red-light.jpg', kind: 'enemy', ang: 0.05, label: 'side2' },
  { file: '_refs2/side3-red-heavy-6wheel.jpg', kind: 'enemy', ang: 0.0, label: 'side3' },
  { file: '_refs2/side4-green-mbt.jpg', kind: 'player', ang: 0.05, label: 'side4' },
];
const wrap = document.getElementById('wrap');
for (let i = 0; i < refs.length; i++) {
  const r = refs[i];
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.name = 'vs-ref' + (i+1);
  const left = document.createElement('div');
  left.className = 'cell';
  const img = document.createElement('img');
  img.src = r.file;
  img.width = 400; img.height = 280;
  const ll = document.createElement('div');
  ll.textContent = r.label + ' ' + r.file.split('/').pop();
  left.appendChild(img); left.appendChild(ll);
  const right = document.createElement('div');
  right.className = 'cell';
  const c = document.createElement('canvas');
  c.width = 400; c.height = 280;
  const rl = document.createElement('div');
  rl.textContent = 'c9d ' + r.kind + (r.label.startsWith('side') ? ' (rot~0° near-side)' : '');
  right.appendChild(c); right.appendChild(rl);
  row.appendChild(left); row.appendChild(right);
  wrap.appendChild(row);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, 400, 280);
  ctx.save();
  ctx.translate(200, 155);
  ctx.scale(1.85, 1.85);
  ctx.translate(-200, -155);
  drawTank(ctx, r.kind, 200, 160, r.ang, r.ang + (r.label.startsWith('side') ? 0.08 : 0.12), 0);
  ctx.restore();
}
document.title = 'C9d vs refs ready';
</script>
</body></html>
