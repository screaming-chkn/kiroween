<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>C9g tank rotations</title>
<style>
  html,body{margin:0;background:#000;color:#47FF9A;font:13px/1.3 ui-monospace,monospace}
  #wrap{display:flex;flex-wrap:wrap;gap:12px;padding:16px;align-items:flex-start}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  canvas{background:#050505;border:1px solid #1a3a28}
  .lab{opacity:.8}
</style>
</head><body>
<div id="wrap"></div>
<script type="module">
import { drawTank, setTankStyle, setTankPalette, setEdgeStyle } from '../src/ui/tankWire.js?v=c9g1';
setTankStyle('wheeled');
setTankPalette('mono-green');
setEdgeStyle('dashed-tech');
const PANEL = 360;
const angles = [
  { name: 'rot0', deg: 0 },
  { name: 'rot45', deg: 45 },
  { name: 'rot90', deg: 90 },
  { name: 'rot-iso', deg: -140 },
];
const wrap = document.getElementById('wrap');
function paintPanel(ctx, w, h, deg) {
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, w, h);
  const ang = deg * Math.PI / 180;
  const cx = w / 2, cy = h / 2 + 8;
  drawTank(ctx, 'player', cx - 55, cy + 10, ang, ang, 0);
  drawTank(ctx, 'enemy', cx + 55, cy - 8, ang + 0.35, ang + 0.55, 0);
}
for (const a of angles) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  const c = document.createElement('canvas');
  c.width = PANEL; c.height = PANEL;
  c.dataset.name = a.name;
  const lab = document.createElement('div');
  lab.className = 'lab';
  lab.textContent = a.name + ' (' + a.deg + '°)';
  cell.appendChild(c); cell.appendChild(lab); wrap.appendChild(cell);
  paintPanel(c.getContext('2d'), PANEL, PANEL, a.deg);
}
// closeup
{
  const cell = document.createElement('div');
  cell.className = 'cell';
  const c = document.createElement('canvas');
  c.width = 520; c.height = 400;
  c.dataset.name = 'closeup';
  const lab = document.createElement('div');
  lab.className = 'lab';
  lab.textContent = 'closeup (iso)';
  cell.appendChild(c); cell.appendChild(lab); wrap.appendChild(cell);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, 520, 400);
  ctx.save();
  ctx.translate(260, 210);
  ctx.scale(2.6, 2.6);
  ctx.translate(-260, -210);
  drawTank(ctx, 'player', 260, 220, -2.45, -2.37, 0);
  ctx.restore();
}
// rot-sheet
{
  const cell = document.createElement('div');
  cell.className = 'cell';
  const c = document.createElement('canvas');
  const pw = 360, ph = 360;
  c.width = pw * 3; c.height = ph;
  c.dataset.name = 'rot-sheet';
  const lab = document.createElement('div');
  lab.className = 'lab';
  lab.textContent = 'rot-sheet';
  cell.appendChild(c); cell.appendChild(lab); wrap.appendChild(cell);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 3; i++) {
    ctx.save();
    ctx.translate(i * pw, 0);
    paintPanel(ctx, pw, ph, [0, 45, 90][i]);
    ctx.restore();
  }
}
document.title = 'C9g rot ready';
</script>
</body></html>
