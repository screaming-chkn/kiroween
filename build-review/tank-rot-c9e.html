<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>C9e tank rotations</title>
<style>
  html,body{margin:0;background:#000;color:#47FF9A;font:13px/1.3 ui-monospace,monospace}
  #wrap{display:flex;flex-wrap:wrap;gap:12px;padding:16px;align-items:flex-start}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  canvas{background:#050505;border:1px solid #1a3a28;image-rendering:pixelated}
  .lab{opacity:.8}
</style>
</head><body>
<div id="wrap"></div>
<script type="module">
import { drawTank, setTankStyle, setTankPalette, setEdgeStyle } from '../src/ui/tankWire.js?v=c9e2';
setTankStyle('wheeled');
setTankPalette('mono-green');
setEdgeStyle('dashed-tech');
const PANEL = 360;
const angles = [
  { name: 'rot0', deg: 0 },
  { name: 'rot45', deg: 45 },
  { name: 'rot90', deg: 90 },
];
const wrap = document.getElementById('wrap');
function paintPanel(ctx, w, h, deg) {
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, w, h);
  const ang = deg * Math.PI / 180;
  const cx = w / 2, cy = h / 2 + 8;
  // Centered pair — equal panel, tank cluster at center
  drawTank(ctx, 'player', cx - 55, cy + 10, ang, ang, 0);
  drawTank(ctx, 'enemy', cx + 55, cy - 8, ang + 0.35, ang + 0.55, 0);
}
for (const a of angles) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  const c = document.createElement('canvas');
  c.width = PANEL; c.height = PANEL;
  c.dataset.name = a.name;
  const lab = document.createElement('div');
  lab.className = 'lab';
  lab.textContent = a.name + ' (' + a.deg + '°)';
  cell.appendChild(c); cell.appendChild(lab); wrap.appendChild(cell);
  paintPanel(c.getContext('2d'), PANEL, PANEL, a.deg);
}
// closeup — single player centered
{
  const cell = document.createElement('div');
  cell.className = 'cell';
  const c = document.createElement('canvas');
  c.width = 420; c.height = 320;
  c.dataset.name = 'closeup';
  const lab = document.createElement('div');
  lab.className = 'lab';
  lab.textContent = 'closeup';
  cell.appendChild(c); cell.appendChild(lab); wrap.appendChild(cell);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, 420, 320);
  ctx.save();
  ctx.translate(210, 170);
  ctx.scale(2.2, 2.2);
  ctx.translate(-210, -170);
  drawTank(ctx, 'player', 210, 175, -0.55, -0.4, 0);
  ctx.restore();
}
// sheet — three equal panels, tanks centered in each
{
  const cell = document.createElement('div');
  cell.className = 'cell';
  const c = document.createElement('canvas');
  const pw = 360, ph = 360;
  c.width = pw * 3; c.height = ph;
  c.dataset.name = 'rot-sheet';
  const lab = document.createElement('div');
  lab.className = 'lab';
  lab.textContent = 'rot-sheet';
  cell.appendChild(c); cell.appendChild(lab); wrap.appendChild(cell);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 3; i++) {
    const deg = [0, 45, 90][i];
    ctx.save();
    ctx.beginPath();
    ctx.rect(i * pw, 0, pw, ph);
    ctx.clip();
    ctx.translate(i * pw, 0);
    paintPanel(ctx, pw, ph, deg);
    ctx.fillStyle = '#47FF9A';
    ctx.globalAlpha = 0.75;
    ctx.font = '12px ui-monospace,monospace';
    ctx.fillText(['rot0','rot45','rot90'][i], 16, 24);
    ctx.globalAlpha = 1;
    ctx.restore();
    // panel divider
    if (i > 0) {
      ctx.strokeStyle = '#1a3a28';
      ctx.beginPath();
      ctx.moveTo(i * pw + 0.5, 0);
      ctx.lineTo(i * pw + 0.5, ph);
      ctx.stroke();
    }
  }
}
document.title = 'C9e tank rotations ready';
</script>
</body></html>
