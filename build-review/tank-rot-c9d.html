<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>C9d tank rotations</title>
<style>
  html,body{margin:0;background:#000;color:#47FF9A;font:13px/1.3 ui-monospace,monospace}
  #wrap{display:flex;flex-wrap:wrap;gap:12px;padding:16px;align-items:flex-start}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  canvas{background:#050505;border:1px solid #1a3a28;image-rendering:pixelated}
  .lab{opacity:.8}
</style>
</head><body>
<div id="wrap"></div>
<script type="module">
import { drawTank, setTankStyle, setTankPalette, setEdgeStyle } from '../src/ui/tankWire.js?v=c9d4';
setTankStyle('wheeled');
setTankPalette('mono-green');
setEdgeStyle('dashed-tech');
const angles = [
  { name: 'rot0', deg: 0 },
  { name: 'rot45', deg: 45 },
  { name: 'rot90', deg: 90 },
];
const wrap = document.getElementById('wrap');
for (const a of angles) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  const c = document.createElement('canvas');
  c.width = 360; c.height = 360;
  c.dataset.name = a.name;
  const lab = document.createElement('div');
  lab.className = 'lab';
  lab.textContent = a.name + ' (' + a.deg + '°)';
  cell.appendChild(c); cell.appendChild(lab); wrap.appendChild(cell);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, 360, 360);
  const ang = a.deg * Math.PI / 180;
  drawTank(ctx, 'player', 120, 190, ang, ang, 0);
  drawTank(ctx, 'enemy', 250, 165, ang + 0.35, ang + 0.55, 0);
}
// closeup canvas
{
  const cell = document.createElement('div');
  cell.className = 'cell';
  const c = document.createElement('canvas');
  c.width = 420; c.height = 320;
  c.dataset.name = 'closeup';
  const lab = document.createElement('div');
  lab.className = 'lab';
  lab.textContent = 'closeup';
  cell.appendChild(c); cell.appendChild(lab); wrap.appendChild(cell);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, 420, 320);
  ctx.save();
  ctx.translate(210, 170);
  ctx.scale(2.2, 2.2);
  ctx.translate(-210, -170);
  drawTank(ctx, 'player', 210, 175, -0.55, -0.4, 0);
  ctx.restore();
}
// sheet
{
  const cell = document.createElement('div');
  cell.className = 'cell';
  const c = document.createElement('canvas');
  c.width = 1080; c.height = 380;
  c.dataset.name = 'rot-sheet';
  const lab = document.createElement('div');
  lab.className = 'lab';
  lab.textContent = 'rot-sheet';
  cell.appendChild(c); cell.appendChild(lab); wrap.appendChild(cell);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, 1080, 380);
  for (let i = 0; i < 3; i++) {
    const ang = [0, 45, 90][i] * Math.PI / 180;
    const cx = 180 + i * 360;
    drawTank(ctx, 'player', cx - 40, 210, ang, ang, 0);
    drawTank(ctx, 'enemy', cx + 70, 180, ang + 0.3, ang + 0.5, 0);
    ctx.fillStyle = '#47FF9A';
    ctx.globalAlpha = 0.7;
    ctx.font = '12px ui-monospace,monospace';
    ctx.fillText(['rot0','rot45','rot90'][i], cx - 20, 30);
    ctx.globalAlpha = 1;
  }
}
document.title = 'C9d tank rotations ready';
</script>
</body></html>
